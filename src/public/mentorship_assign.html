<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assign Mentorship - Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; }
        .card { box-shadow: 0 0 15px rgba(0,0,0,0.1); border: none; }
        .dashboard-header { background-color: #343a40; color: white; padding: 15px; border-radius: 5px 5px 0 0; }
    </style>
</head>
<body>

<div class="container mt-5">
    <div class="card mb-4">
        <div class="dashboard-header">
            <h4 class="mb-0">Assign Class Mentor</h4>
        </div>
        <div class="card-body">
            <form action="assign_mentor_process.php" method="POST">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="facultySelect" class="form-label">Select Faculty</label>
                        <select class="form-select" id="facultySelect" name="faculty_id" required>
                            <option value="" selected disabled>Choose Faculty...</option>
                            <option value="101">Dr. Amit Sharma</option>
                            <option value="102">Prof. Neha Verma</option>
                            <option value="103">Mr. Rahul Gupta</option>
                            </select>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="courseSelect" class="form-label">Select Course</label>
                        <select class="form-select" id="courseSelect" name="course" required>
                            <option value="" selected disabled>Choose Course...</option>
                            <option value="BCA">BCA</option>
                            <option value="BTech">B.Tech</option>
                            <option value="BBA">BBA</option>
                        </select>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="semSelect" class="form-label">Select Semester</label>
                        <select class="form-select" id="semSelect" name="semester" required>
                            <option value="" selected disabled>Choose Semester...</option>
                            <option value="1">1st Semester</option>
                            <option value="2">2nd Semester</option>
                            <option value="3">3rd Semester</option>
                            <option value="4">4th Semester</option>
                        </select>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="sectionSelect" class="form-label">Select Section</label>
                        <select class="form-select" id="sectionSelect" name="section" required>
                            <option value="" selected disabled>Choose Section...</option>
                            <option value="A">Section A</option>
                            <option value="B">Section B</option>
                            <option value="C">Section C</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary mt-3">Assign Mentor</button>
            </form>
        </div>
    </div>

    <div class="card">
        <div class="dashboard-header bg-secondary">
            <h4 class="mb-0">Currently Assigned Mentors</h4>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-bordered table-hover">
                    <thead class="table-light">
                        <tr>
                            <th>S.No</th>
                            <th>Faculty Name</th>
                            <th>Course</th>
                            <th>Semester</th>
                            <th>Section</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>1</td>
                            <td>Dr. Amit Sharma</td>
                            <td>BCA</td>
                            <td>4th Semester</td>
                            <td>A</td>
                            <td>
                                <button class="btn btn-sm btn-danger">Remove</button>
                            </td>
                        </tr>
                        </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
